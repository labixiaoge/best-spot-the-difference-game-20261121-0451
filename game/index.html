<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双灯谜市 · Twin Lanterns — 找不同</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b1e; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 1280 / 720));
    height: min(100vh, calc(100vw * 720 / 1280));
    display: block; touch-action: none; cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="双灯谜市：左右两幅图里找 7 处不同，点击不同处得分"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
